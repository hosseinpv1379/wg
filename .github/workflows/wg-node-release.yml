name: Build and release WG Node

on:
  push:
    tags:
      - 'wg-node-v*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wg-node/go.mod
          cache-dependency-path: wg-node/go.mod
      - name: Test and build Linux binaries
        working-directory: wg-node
        run: |
          mkdir -p ../dist
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/wg-node-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/wg-node-linux-arm64 .
          cd ../dist
          sha256sum wg-node-linux-amd64 wg-node-linux-arm64 > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wg-node-linux-amd64
            dist/wg-node-linux-arm64
            dist/SHA256SUMS
