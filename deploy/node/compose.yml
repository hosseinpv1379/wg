services:
  wireguard:
    build:
      context: ../..
      dockerfile: Dockerfile.wireguard
    container_name: wg-node-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      WG_SERVER_INTERFACE: wg0
      WG_SERVER_PORT: ${WG_SERVER_PORT:-51820}
      WG_SERVER_ADDRESS: ${WG_SERVER_ADDRESS:-10.45.0.1/24}
      WG_CLIENT_POOL: ${WG_CLIENT_POOL:-10.44.0.0/24}
      WG_SERVER_STATE_PATH: /var/lib/wg-node
      WG_UPLINK_INTERFACE: eth0
    volumes:
      - ./data/wireguard:/var/lib/wg-node
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_SERVER_PORT:-51820}:${WG_SERVER_PORT:-51820}/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  agent:
    build:
      context: ../..
      dockerfile: Dockerfile.agent
    container_name: wg-node-agent
    network_mode: service:wireguard
    cap_add:
      - NET_ADMIN
    depends_on:
      wireguard:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      WG_AGENT_INTERFACE: wg0
      WG_AGENT_LISTEN_HOST: 127.0.0.1
      WG_AGENT_LISTEN_PORT: 8787
      WG_AGENT_STATE_PATH: /var/lib/wg-agent/agent.sqlite3
    volumes:
      - ./data/agent:/var/lib/wg-agent
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: wg-node-caddy
    network_mode: service:wireguard
    depends_on:
      - agent
    environment:
      WG_AGENT_DOMAIN: ${WG_AGENT_DOMAIN:?Set WG_AGENT_DOMAIN to a DNS name pointing to this node}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    restart: unless-stopped
