[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-service"
version = "0.1.0"
description = "Multi-tenant WireGuard management, billing API, and operations console"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "qrcode[pil]>=8,<9",
  "alembic>=1.13,<2",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
wg-service = "app.cli:main"

[tool.setuptools]
py-modules = ["wg_manager"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
