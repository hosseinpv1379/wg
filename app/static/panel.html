<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b38">
  <title>WireGuard | کنسول مدیریت</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b2c2b;
      --muted: #697b78;
      --line: #dce5e1;
      --canvas: #f3f6f4;
      --paper: #fff;
      --sidebar: #173b38;
      --sidebar-muted: #a8c2bb;
      --green: #14745f;
      --green-hover: #105b4c;
      --green-soft: #e6f4ed;
      --blue: #376f98;
      --blue-soft: #eaf2f8;
      --amber: #9a6415;
      --amber-soft: #fbf2df;
      --red: #a54143;
      --red-soft: #faeaea;
      --purple: #7157a5;
      --purple-soft: #f0ecf8;
      --shadow: 0 14px 44px #18312d24;
      font-synthesis: none;
    }
    * { box-sizing: border-box }
    body { margin: 0; color: var(--ink); background: var(--canvas); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif }
    button, input, select, textarea { font: inherit }
    button { cursor: pointer }
    button:disabled { cursor: wait; opacity: .55 }
    .app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr) }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 19px 14px 14px; overflow-y: auto; color: #edf5f1; background: var(--sidebar) }
    .brand { display: flex; align-items: center; gap: 11px; padding: 3px 8px 18px; border-bottom: 1px solid #ffffff21 }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; background: #67b696; color: #103e34; font-weight: 800; font-size: 13px; direction: ltr }
    .brand-name { font-size: 15px; font-weight: 700; line-height: 1.25 }
    .brand-caption { display: block; margin-top: 3px; color: var(--sidebar-muted); font-size: 11px; font-weight: 500 }
    .nav-group { margin-top: 19px }
    .nav-title { padding: 0 10px 7px; color: var(--sidebar-muted); font-size: 11px; font-weight: 700 }
    .nav-list { display: grid; gap: 3px }
    .nav-item { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 5px; color: #e3eeea; background: transparent; text-align: right; font-size: 13px }
    .nav-item:hover { background: #ffffff10 }
    .nav-item.active { color: #fff; background: #2b5e53; box-shadow: inset -2px 0 #7ed1ae }
    .nav-symbol { width: 19px; color: #9ed2bb; font-size: 15px; text-align: center }
    .nav-item.active .nav-symbol { color: #c2f4dc }
    .sidebar-spacer { flex: 1 }
    .connection-state { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 10px; border-top: 1px solid #ffffff21; color: #d9e9e2; font-size: 11px }
    .connection-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #d8a44c }
    .connection-dot.online { background: #6ed19b }
    .workspace { min-width: 0; padding: 0 clamp(16px, 3vw, 42px) 48px }
    .topbar { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line) }
    .page-heading { min-width: 0 }
    h1 { margin: 0; font-size: 21px; line-height: 1.3; font-weight: 750 }
    .page-subtitle { margin-top: 4px; color: var(--muted); font-size: 13px }
    .top-actions { display: flex; align-items: center; gap: 8px }
    .updated-at { color: var(--muted); font-size: 11px; white-space: nowrap }
    .icon-button, .outline-button, .primary-button, .danger-button, .quiet-button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 5px; padding: 7px 11px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s }
    .icon-button { width: 36px; padding: 0; border-color: var(--line); background: var(--paper); color: var(--ink); font-size: 17px }
    .outline-button { border-color: var(--line); background: var(--paper); color: var(--ink) }
    .outline-button:hover, .icon-button:hover { border-color: #aac0b7; background: #f9fbfa }
    .primary-button { background: var(--green); color: white }
    .primary-button:hover { background: var(--green-hover) }
    .danger-button { border-color: #efd0d0; background: #fff; color: var(--red) }
    .danger-button:hover { background: var(--red-soft) }
    .quiet-button { min-height: 32px; padding: 4px 7px; background: transparent; color: var(--green); font-size: 12px }
    .quiet-button:hover { background: var(--green-soft) }
    .quiet-button.danger { color: var(--red) }
    .main-content { padding-top: 23px }
    .page-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px }
    .page-toolbar h2 { margin: 0; font-size: 17px }
    .page-toolbar p { margin: 4px 0 0; color: var(--muted); font-size: 12px }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 7px }
    .stats-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px }
    .stat { position: relative; min-width: 0; min-height: 104px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper) }
    .stat::before { position: absolute; content: ""; top: 14px; right: 0; width: 3px; height: 27px; border-radius: 3px 0 0 3px; background: var(--stat-color, var(--green)) }
    .stat-label { display: block; color: var(--muted); font-size: 12px }
    .stat-value { display: block; margin-top: 7px; font-size: 25px; line-height: 1.1; font-weight: 750; direction: ltr; text-align: right; unicode-bidi: plaintext }
    .stat-note { display: block; margin-top: 7px; color: var(--muted); font-size: 11px }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .85fr); gap: 14px; align-items: start }
    .panel-section { min-width: 0; margin-bottom: 17px; border-top: 1px solid var(--line); padding-top: 13px }
    .panel-section.flush { border-top: 0; padding-top: 0 }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 11px }
    .section-heading h2, .section-heading h3 { margin: 0; font-size: 15px }
    .section-heading p { margin: 3px 0 0; color: var(--muted); font-size: 12px }
    .section-link { border: 0; background: transparent; color: var(--green); font-size: 11px }
    .surface { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--paper) }
    .surface-pad { padding: 15px }
    .table-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--paper) }
    table { width: 100%; border-collapse: collapse; text-align: right }
    th, td { height: 46px; padding: 9px 12px; border-bottom: 1px solid #edf1ef; vertical-align: middle; white-space: nowrap }
    th { height: 40px; color: #566d68; background: #f8faf9; font-size: 11px; font-weight: 700 }
    td { font-size: 13px }
    tbody tr:hover { background: #f9fbfa }
    tr:last-child td { border-bottom: 0 }
    .table-primary { display: block; color: var(--ink); font-weight: 650 }
    .table-secondary { display: block; margin-top: 2px; color: var(--muted); font-size: 11px }
    .mono { direction: ltr; text-align: left; unicode-bidi: plaintext; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px; border-radius: 4px; color: var(--amber); background: var(--amber-soft); font-size: 10px; line-height: 1.4 }
    .status::before { width: 6px; height: 6px; content: ""; flex: none; border-radius: 50%; background: currentColor }
    .status.good { color: var(--green); background: var(--green-soft) }
    .status.info { color: var(--blue); background: var(--blue-soft) }
    .status.bad { color: var(--red); background: var(--red-soft) }
    .status.purple { color: var(--purple); background: var(--purple-soft) }
    .empty-state { padding: 30px 16px; color: var(--muted); text-align: center; font-size: 12px }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 13px }
    .toolbar { display: flex; align-items: end; flex-wrap: wrap; gap: 8px; margin: 13px 0 }
    .field { min-width: 0; margin-bottom: 12px }
    .toolbar .field { flex: 1 1 170px; margin: 0 }
    .toolbar .field.narrow { flex: 0 1 150px }
    label { display: block; margin-bottom: 5px; color: #455b56; font-size: 11px; font-weight: 600 }
    input, select, textarea { width: 100%; min-height: 38px; border: 1px solid #cbd8d2; border-radius: 4px; padding: 8px 10px; color: var(--ink); background: white; outline: none }
    input[dir="ltr"], .ltr-input { direction: ltr; text-align: left }
    input:focus, select:focus, textarea:focus { border-color: #4b9a7e; box-shadow: 0 0 0 3px #4b9a7e20 }
    textarea { min-height: 78px; resize: vertical }
    .field-help { margin-top: 4px; color: var(--muted); font-size: 10px }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px }
    .notice { margin: 11px 0; padding: 10px 12px; border-right: 3px solid #d69c3e; border-radius: 3px; color: #70501b; background: var(--amber-soft); font-size: 11px }
    .notice.error { border-color: var(--red); color: #84393c; background: var(--red-soft) }
    .notice.info { border-color: var(--blue); color: #315f80; background: var(--blue-soft) }
    .notice.success { border-color: var(--green); color: #23634e; background: var(--green-soft) }
    .bar-list { display: grid; gap: 11px }
    .bar-row { display: grid; grid-template-columns: 67px minmax(60px, 1fr) 30px; align-items: center; gap: 8px; color: var(--muted); font-size: 10px }
    .bar-track { height: 8px; overflow: hidden; border-radius: 5px; background: #edf1ef }
    .bar-fill { height: 100%; min-width: 2px; border-radius: inherit; background: var(--bar-color, var(--green)) }
    .node-list { display: grid; gap: 0 }
    .node-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #edf1ef }
    .node-row:last-child { border-bottom: 0 }
    .node-meta { min-width: 0 }
    .node-meta strong { display: block; font-size: 12px }
    .node-meta span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px }
    .progress-line { width: 90px; height: 5px; overflow: hidden; border-radius: 4px; background: #e9efec }
    .progress-line i { display: block; height: 100%; border-radius: inherit; background: #dcaa54 }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; color: var(--muted); font-size: 10px }
    .pagination-actions { display: flex; gap: 5px }
    .pagination-actions button { min-height: 30px; padding: 4px 8px }
    .actions-cell { display: flex; align-items: center; gap: 2px }
    .filter-search { position: relative; flex: 1 1 240px }
    .filter-search input { padding-right: 34px }
    .filter-search .search-symbol { position: absolute; top: 9px; right: 11px; color: #82938e }
    .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 5px; background: #edf2ef }
    .segmented button { min-height: 29px; border: 0; border-radius: 3px; padding: 4px 9px; color: var(--muted); background: transparent; font-size: 10px }
    .segmented button.active { color: var(--ink); background: white; box-shadow: 0 1px 3px #163c3022 }
    .mobile-menu { display: none }
    .nav-scrim { display: none }
    .scope-cell { min-width: 240px; max-width: 430px; white-space: normal; line-height: 2 }
    .scope-tag { display: inline-block; padding: 1px 6px; margin: 2px 0; border: 1px solid #dce8e8; border-radius: 3px; background: #f2f7f7; color: #3c6570; direction: ltr; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
    .detail-strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px }
    .quick-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 0 0 22px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line) }
    .quick-actions strong { display: block; font-size: 14px }
    .quick-actions span { color: var(--muted); font-size: 12px }
    .quick-actions-buttons { display: flex; flex-wrap: wrap; gap: 8px }
    :is(button, input, select, textarea):focus-visible { outline: 2px solid #14745f; outline-offset: 2px }
    .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: #10272388; backdrop-filter: blur(2px) }
    .dialog { width: min(550px, 100%); max-height: min(88vh, 850px); overflow: auto; border: 1px solid #d7e1dc; border-radius: 7px; background: white; box-shadow: var(--shadow) }
    .dialog.wide { width: min(760px, 100%) }
    .dialog-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 17px; border-bottom: 1px solid var(--line); background: white }
    .dialog-head strong { font-size: 14px }
    .dialog-body { padding: 16px 17px }
    .dialog-foot { position: sticky; bottom: 0; display: flex; justify-content: flex-start; gap: 7px; padding: 11px 17px; border-top: 1px solid var(--line); background: #fff }
    .dialog-close { width: 31px; height: 31px; flex: none; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: #fff; font-size: 17px }
    .checkbox-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; padding: 8px 0 }
    .check-row { display: flex; align-items: center; gap: 7px; color: var(--ink); font-size: 11px }
    .check-row input { width: 15px; min-height: auto; height: 15px; margin: 0; accent-color: var(--green) }
    .secret-output { padding: 12px; border: 1px solid #e7dcae; border-radius: 4px; background: #fffaf0 }
    .secret-output code { display: block; overflow-wrap: anywhere; margin-top: 7px; color: #283e37; direction: ltr; text-align: left; font-size: 11px }
    .qr-image { display: block; width: min(320px, 100%); height: auto; margin: 8px auto 0; image-rendering: pixelated }
    .toast-stack { position: fixed; left: 18px; bottom: 18px; z-index: 40; display: grid; gap: 7px; width: min(390px, calc(100vw - 36px)) }
    .toast { padding: 10px 13px; border: 1px solid #ffffff22; border-radius: 5px; color: white; background: #214d40; box-shadow: 0 7px 22px #18342f2b; font-size: 12px; animation: toast-in .18s ease-out }
    .toast.error { background: #873d40 }
    .hidden { display: none !important }
    .spin { display: inline-block; animation: spin .8s linear infinite }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes toast-in { from { transform: translateY(7px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    @media (max-width: 1120px) {
      .app { grid-template-columns: 218px minmax(0, 1fr) }
      .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) }
      .dashboard-grid { grid-template-columns: minmax(0, 1fr) }
    }
    @media (max-width: 1000px) {
      .app { display: block }
      .sidebar { position: fixed; z-index: 22; top: 0; right: 0; width: 270px; height: 100dvh; transform: translateX(105%); transition: transform .18s ease; box-shadow: var(--shadow) }
      .sidebar.open { transform: translateX(0) }
      .sidebar.open + .nav-scrim { display: block; position: fixed; inset: 0; z-index: 21; width: 100%; height: 100%; border: 0; background: #11292777 }
      .mobile-menu { display: inline-flex }
      .workspace { padding: 0 clamp(14px, 3vw, 34px) 36px }
    }
    @media (max-width: 760px) {
      .workspace { padding: 0 14px 32px }
      .topbar { min-height: 68px; gap: 8px }
      .top-actions { gap: 5px }
      .updated-at { display: none }
      h1 { font-size: 18px }
      .page-subtitle { font-size: 10px }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px }
      .stat { min-height: 91px; padding: 12px }
      .stat-value { font-size: 20px }
      .stat:last-child:nth-child(odd) { grid-column: 1 / -1 }
      .main-content { padding-top: 16px }
    }
    @media (max-width: 480px) {
      .workspace { padding-right: 11px; padding-left: 11px }
      .key-button-label { display: none }
      .grid-2 { grid-template-columns: 1fr }
      .checkbox-list { grid-template-columns: 1fr }
      .page-toolbar { align-items: flex-start }
      .table-scroll table { min-width: 660px }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">WG</span><span class="brand-name">WireGuard Manager<span class="brand-caption">کنسول مدیریت سرویس</span></span></div>
      <nav aria-label="ناوبری پنل">
        <div class="nav-group"><div class="nav-title">مدیریت فروش</div><div class="nav-list">
          <button class="nav-item active" data-view="overview"><span class="nav-symbol">▦</span>نمای کلی</button>
          <button class="nav-item" data-view="plans"><span class="nav-symbol">◇</span>طرح‌ها</button>
          <button class="nav-item" data-view="users"><span class="nav-symbol">◎</span>کاربران</button>
          <button class="nav-item" data-view="orders"><span class="nav-symbol">≡</span>سفارش‌ها</button>
          <button class="nav-item" data-view="subscriptions"><span class="nav-symbol">▤</span>اشتراک‌ها</button>
        </div></div>
        <div class="nav-group"><div class="nav-title">زیرساخت شبکه</div><div class="nav-list">
          <button class="nav-item" data-view="nodes"><span class="nav-symbol">⌘</span>Nodeها</button>
          <button class="nav-item" data-view="interfaces"><span class="nav-symbol">◫</span>Interfaceها</button>
          <button class="nav-item" data-view="peers"><span class="nav-symbol">⌁</span>کلاینت‌ها و Peerها</button>
        </div></div>
        <div class="nav-group"><div class="nav-title">یکپارچه‌سازی و امنیت</div><div class="nav-list">
          <button class="nav-item" data-view="webhooks"><span class="nav-symbol">↗</span>Webhookها</button>
          <button class="nav-item" data-view="keys"><span class="nav-symbol">⚿</span>کلیدهای API</button>
          <button class="nav-item" data-view="audit"><span class="nav-symbol">◷</span>گزارش رویدادها</button>
        </div></div>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="connection-state"><span class="connection-dot" id="connection-dot"></span><span id="connection-label">اتصال بررسی نشده</span></div>
    </aside>
    <button type="button" class="nav-scrim" id="nav-scrim" aria-label="بستن منو"></button>
    <main class="workspace">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <button class="icon-button mobile-menu" id="mobile-menu" title="بازکردن منو" aria-label="بازکردن منو">☰</button>
          <div class="page-heading"><h1 id="page-title">نمای کلی</h1><div class="page-subtitle" id="page-subtitle">وضعیت لحظه‌ای سرویس و عملیات فروش</div></div>
        </div>
        <div class="top-actions"><span class="updated-at" id="updated-at"></span><button class="outline-button" id="api-key-button" title="تنظیم کلید API"><span>⚿</span><span class="key-button-label">کلید API</span></button><button class="icon-button" id="refresh-button" title="به‌روزرسانی داده‌ها" aria-label="به‌روزرسانی">↻</button></div>
      </header>
      <div class="main-content" id="view" aria-live="polite"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const state = {
      view: 'overview', busy: false, lastUpdated: null,
      nodes: [], servers: [], plans: [], orders: [], subscriptions: [], users: [], keys: [],
      peers: [], peerTotal: 0, peerSummary: null, peerOffset: 0,
      ordersOffset: 0, subscriptionsOffset: 0, usersOffset: 0, keysOffset: 0,
      ordersHasNext: false, subscriptionsHasNext: false, userTotal: 0, keyTotal: 0,
      orderFilters: { q: '', status: '' }, subscriptionFilters: { q: '', status: '' },
      userFilters: { q: '', status: '' },
      webhooks: [], audit: [], userLookup: null,
      errors: {}, peerFilters: { q: '', status: '', country: '' },
      deliveryWebhook: null, deliveryRows: [],
    };
    const PAGE_SIZE = 50;
    const PAGE = {
      overview: ['نمای کلی', 'وضعیت لحظه‌ای سرویس و عملیات فروش'],
      plans: ['طرح‌های فروش', 'تعریف تعرفه، حجم، مدت و موقعیت‌های قابل انتخاب'],
      users: ['مدیریت کاربران', 'ساخت حساب فروشگاهی و مشاهده کاربران شناخته‌شده'],
      orders: ['سفارش‌ها', 'پیگیری خرید، مبلغ و تأیید پرداخت'],
      subscriptions: ['اشتراک‌ها', 'وضعیت سرویس، مصرف، تمدید و تعلیق'],
      nodes: ['Nodeها', 'مدیریت ماشین‌های WireGuard و اتصال آن‌ها به پنل'],
      interfaces: ['Interfaceها', 'Endpointها، pool آدرس و سلامت سرورهای WireGuard'],
      peers: ['کلاینت‌ها و Peerها', 'دستگاه‌ها، مصرف و فایل‌های اتصال محرمانه'],
      webhooks: ['Webhookها', 'ارسال رویدادهای سرویس به Backend فروش'],
      keys: ['کلیدهای API', 'صدور کلید محدود برای اتصال Backendها'],
      audit: ['گزارش رویدادها', 'ردیابی تغییرات ثبت‌شده در سرویس'],
    };
    const SCOPES = [
      ['plans:read', 'مشاهده طرح‌ها'], ['plans:write', 'مدیریت طرح‌ها'],
      ['users:read', 'مشاهده کاربر'], ['users:write', 'ساخت و مدیریت کاربر'],
      ['orders:create', 'ساخت سفارش'], ['orders:read', 'مشاهده سفارش‌ها'],

    ];
    const EVENTS = ['payment.confirmed', 'subscription.active', 'subscription.failed', 'subscription.suspended', 'subscription.resumed', 'subscription.expired', 'subscription.exhausted', 'subscription.quota_80', 'subscription.quota_90', 'peer.created'];
    const STATUS = {
      active: ['فعال', 'good'], online: ['آنلاین', 'good'], healthy: ['سالم', 'good'],

      disabled: ['غیرفعال', 'bad'], suspended: ['معلق', 'bad'], expired: ['منقضی', 'bad'], exhausted: ['حجم تمام‌شده', 'bad'],

      confirmed: ['تأییدشده', 'good'], purchase: ['خرید', 'info'], renewal: ['تمدید', 'purple'],
      queued: ['در صف', 'info'], running: ['در حال اجرا', 'info'], done: ['انجام‌شده', 'good'],

    function apiKey() { return sessionStorage.getItem('wg_api_key') || ''; }
    function esc(value = '') { return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
    function num(value) { return Number(value || 0).toLocaleString('en-US'); }
    function date(value, withTime = false) {
      if (!value) return '—';

    }
    function bytes(value) {
      let amount = Number(value) || 0, unit = 0;

      while (amount >= 1024 && unit < names.length - 1) { amount /= 1024; unit++; }
      return `${new Intl.NumberFormat('en-US', { maximumFractionDigits: unit ? 1 : 0 }).format(amount)} ${names[unit]}`;
    }
    function money(amount, currency = 'IRR') {
      const value = num(amount);
      return `${value} ${esc(currency)}`;
    }
    function status(value, fallback = '') {
      const item = STATUS[value] || [fallback || value || 'نامشخص', ''];
      return `<span class="status ${item[1]}">${esc(item[0])}</span>`;
    }
    function toast(message, isError = false) {
      const item = document.createElement('div');
      item.className = `toast${isError ? ' error' : ''}`;
      item.textContent = message;
      $('#toast-stack').append(item);
      setTimeout(() => item.remove(), 4300);
    }
    class ApiError extends Error {
      constructor(message, { code = '', statusCode = 0, requestId = '' } = {}) {
        super(message); this.code = code; this.statusCode = statusCode; this.requestId = requestId;
      }
    }
    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (apiKey()) headers['X-API-Key'] = apiKey();
      if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      let response;
      try { response = await fetch(`/api/v1${path}`, { ...options, headers, signal: options.signal || AbortSignal.timeout(25000) }); }
      catch (error) { throw new ApiError(error.name === 'TimeoutError' ? 'زمان پاسخ API تمام شد' : 'ارتباط با API برقرار نشد', { code: 'NETWORK_ERROR' }); }
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.success === false) {
        const detail = body.error || body.detail || {};
        const error = new ApiError(detail.message || `خطای درخواست (${response.status})`, {
          code: detail.code || '', statusCode: response.status, requestId: body.request_id || response.headers.get('X-Request-ID') || '',
        });
        if (response.status === 401 && apiKey()) {
          sessionStorage.removeItem('wg_api_key');
          setConnection(false, 'کلید نامعتبر یا منقضی');

      }

    }
    async function binary(path) {

      catch { throw new ApiError('دریافت فایل از API ناموفق بود', { code: 'NETWORK_ERROR' }); }
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        const detail = body.error || {};
        throw new ApiError(detail.message || `خطای دریافت فایل (${response.status})`, { code: detail.code || '', statusCode: response.status, requestId: body.request_id || '' });
      }
      return response.blob();
    }
    function setConnection(connected, message) {
      $('#connection-dot').classList.toggle('online', connected);

    function listQuery(offset, filters = {}, limit = PAGE_SIZE) {

    function errorNotice(resource, needed) {

      return `<div class="notice error">دریافت اطلاعات با خطا روبه‌رو شد: ${esc(error.message)}${error.requestId ? ` · شناسه پیگیری <code dir="ltr">${esc(error.requestId)}</code>` : ''}</div>`;
    }
    async function loadResource(name, path, fallback) {
      try { const result = await api(path); state[name] = result; delete state.errors[name]; return result; }
      catch (error) { state.errors[name] = error; state[name] = fallback; return fallback; }
    }
    async function refreshAll() {
      if (!apiKey()) { renderLogin(); return; }
      if (state.busy) return;
      state.busy = true;
      $('#refresh-button').classList.add('spin');
      const jobs = [
        loadResource('nodes', '/nodes', []),
        loadResource('servers', '/servers?include_disabled=true', []),
        loadResource('plans', '/plans?include_disabled=true', []),
        loadResource('orders', `/orders?${listQuery(0, state.orderFilters, PAGE_SIZE + 1)}`, []),
        loadResource('subscriptions', `/subscriptions?${listQuery(0, state.subscriptionFilters, PAGE_SIZE + 1)}`, []),
        loadResource('userPage', `/users?${listQuery(0, state.userFilters)}`, { items: [], total: 0 }),
        loadResource('keyPage', `/api-keys?${listQuery(0)}`, { items: [], total: 0 }),
        loadResource('webhooks', '/webhooks', []),
        (async () => {
          try {
            const path = state.view === 'peers' ? `/peers?${listQuery(state.peerOffset, state.peerFilters)}` : '/peers?offset=0&limit=1';
            const result = await api(path);
            state.peerSummary = result.summary || null;
            if (state.view === 'peers') { state.peers = result.items || []; state.peerTotal = result.total || 0; }
            delete state.errors.peers; return result;
          } catch (error) { state.errors.peers = error; state.peerSummary = null; return null; }
        })(),
      ];
      await Promise.all(jobs);
      state.users = state.userPage.items; state.userTotal = state.userPage.total;
      state.keys = state.keyPage.items; state.keyTotal = state.keyPage.total;
      state.ordersOffset = 0; state.ordersHasNext = state.orders.length > PAGE_SIZE;

      state.orders = state.orders.slice(0, PAGE_SIZE);
      state.subscriptions = state.subscriptions.slice(0, PAGE_SIZE);
      state.usersOffset = 0; state.keysOffset = 0;
      state.lastUpdated = new Date(); state.busy = false;
      const authError = Object.values(state.errors).some(error => error.statusCode === 401);
      const networkError = Object.values(state.errors).some(error => error.code === 'NETWORK_ERROR');
      setConnection(!authError && !networkError, authError ? 'کلید نیازمند بررسی است' : networkError ? 'اختلال در ارتباط' : 'متصل به API مرکزی');

    }
    let modalCleanup = null;
    function openModal(title, body, { submit = 'ذخیره', wide = false, onSubmit = null, hideSubmit = false, onClose = null } = {}) {
      closeModal();
      modalCleanup = onClose;
      const root = $('#modal-root');
      root.innerHTML = `<div class="overlay" data-overlay><form class="dialog${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><strong>${esc(title)}</strong><button type="button" class="dialog-close" data-close aria-label="بستن">×</button></div><div class="dialog-body">${body}</div>${hideSubmit ? '' : `<div class="dialog-foot"><button class="primary-button" type="submit">${esc(submit)}</button><button class="outline-button" type="button" data-close>انصراف</button></div>`}</form></div>`;
      root.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeModal));
      root.querySelector('[data-overlay]').addEventListener('click', event => { if (event.target === event.currentTarget) closeModal(); });
      if (onSubmit) root.querySelector('form').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget, submitButton = form.querySelector('[type="submit"]');
        submitButton.disabled = true; submitButton.textContent = 'در حال انجام…';
        try {
          const values = new FormData(form);
          const result = await onSubmit(values, form);
          if (result?.keepOpen) return;
          closeModal();
          await refreshAll();
          toast(result?.message || 'تغییرات ذخیره شد');
        } catch (error) { toast(error.message, true); if (submitButton.isConnected) { submitButton.disabled = false; submitButton.textContent = submit; } }
      });
      root.querySelector('input:not([type="hidden"]), select, textarea')?.focus();
    }
    function closeModal() {

      $('#modal-root').replaceChildren();

    function copyText(value, message = 'کپی شد') {

    async function loadOrders(offset = state.ordersOffset) {
      try {
        const nextOffset = Math.max(0, offset);
        const result = await api(`/orders?${listQuery(nextOffset, state.orderFilters, PAGE_SIZE + 1)}`);
        state.ordersOffset = nextOffset; state.orders = (result || []).slice(0, PAGE_SIZE);
        state.ordersHasNext = result.length > PAGE_SIZE; delete state.errors.orders;
      } catch (error) { state.errors.orders = error; toast(error.message, true); }
      renderView();
    }
    async function loadSubscriptions(offset = state.subscriptionsOffset) {
      try {
        const nextOffset = Math.max(0, offset);
        const result = await api(`/subscriptions?${listQuery(nextOffset, state.subscriptionFilters, PAGE_SIZE + 1)}`);
        state.subscriptionsOffset = nextOffset; state.subscriptions = (result || []).slice(0, PAGE_SIZE);
        state.subscriptionsHasNext = result.length > PAGE_SIZE; delete state.errors.subscriptions;
      } catch (error) { state.errors.subscriptions = error; toast(error.message, true); }
      renderView();

        delete state.errors.userPage;

      renderView();

        const nextOffset = Math.max(0, offset);
        const result = await api(`/api-keys?${listQuery(nextOffset)}`);
        state.keysOffset = nextOffset; state.keys = result.items || []; state.keyTotal = result.total || 0;

    async function loadAudit() { await loadResource('audit', '/audit-logs?offset=0&limit=100', []); renderView(); }
    async function go(view) {
      state.view = view; renderView();
      if (!apiKey()) return;
      if (view === 'peers') { try { await loadPeers(); } catch (error) { state.errors.peers = error; renderView(); } }
      if (view === 'users') await loadUsers();
      if (view === 'orders') await loadOrders(state.ordersOffset);
      if (view === 'subscriptions') await loadSubscriptions(state.subscriptionsOffset);
      if (view === 'keys') await loadKeys();
      if (view === 'audit') await loadAudit();
    }
    function nodeSetup() {
      openModal('ثبت Node جدید', `<div class="grid-2"><div class="field"><label>نام نمایشی</label><input name="name" required maxlength="120" placeholder="Germany-1"></div><div class="field"><label>کد کشور</label><input name="country" required minlength="2" maxlength="2" class="ltr-input" placeholder="DE"></div></div><div class="notice info">شناسه و SERVER_API_KEY پس از ثبت فقط یک‌بار نمایش داده می‌شود. فرمان نصب آماده را روی VPS اجرا کنید.</div>`, {
        submit: 'ساخت اطلاعات نصب', onSubmit: async values => {
          const result = await api('/nodes/setup', { method: 'POST', body: JSON.stringify({ name: values.get('name').trim(), country: values.get('country').trim().toUpperCase() }) });
          closeModal(); showNodeSetupResult(result); await refreshAll(); return { keepOpen: true };
        },
      });
    }
    function showNodeSetupResult(result) {
      const command = `curl -fsSL ${location.origin}/install/node.sh -o /tmp/wg-node-install.sh && if [ "$(id -u)" -eq 0 ]; then bash /tmp/wg-node-install.sh; else sudo bash /tmp/wg-node-install.sh; fi`;
      openModal('Node آماده نصب است', `<div class="notice">این کلید مخصوص همین Node است و فقط یک‌بار نمایش داده می‌شود. آن را امن نگه‌دارید.</div><div class="field"><label>NODE_ID</label><input dir="ltr" readonly value="${esc(result.node_id)}"></div><div class="field"><label>SERVER_API_KEY</label><input dir="ltr" readonly value="${esc(result.node_api_key)}"></div><div class="field"><label>فرمان نصب روی VPS</label><textarea dir="ltr" readonly>${esc(command)}</textarea></div><p class="field-help">فرمان را در ترمینال root نود اجرا کنید؛ URL پنل، آدرس عمومی و پورت WireGuard را وارد کنید. ورودی سرور فقط به UDP پورت WireGuard نیاز دارد.</p>`, { hideSubmit: true });
      const foot = document.createElement('div'); foot.className = 'dialog-foot'; foot.innerHTML = '<button class="outline-button" data-copy-node="id">کپی NODE_ID</button><button class="outline-button" data-copy-node="key">کپی API Key</button><button class="primary-button" data-copy-node="command">کپی فرمان نصب</button><button class="outline-button" data-close>بستن</button>';
      $('.dialog', $('#modal-root')).append(foot);
      foot.querySelector('[data-copy-node="id"]').onclick = () => copyText(result.node_id, 'NODE_ID کپی شد');
      foot.querySelector('[data-copy-node="key"]').onclick = () => copyText(result.node_api_key, 'کلید Node کپی شد');
      foot.querySelector('[data-copy-node="command"]').onclick = () => copyText(command, 'فرمان نصب کپی شد');
      foot.querySelector('[data-close]').onclick = closeModal;
    }
    function serverForm() {
      const usableNodes = state.nodes.filter(node => node.active);
      if (!usableNodes.length) { toast('ابتدا یک Node فعال بسازید.', true); return; }
      const options = usableNodes.map(node => `<option value="${esc(node.id)}">${esc(node.name)} · ${esc(node.country)}</option>`).join('');
      openModal('ثبت Interface روی Node', `<div class="grid-2"><div class="field"><label>Node</label><select name="node_id">${options}</select></div><div class="field"><label>نام نمایشی</label><input name="name" required maxlength="120" placeholder="Germany 1"></div><div class="field"><label>نام Interface لینوکس</label><input name="interface_name" required maxlength="15" pattern="[a-zA-Z0-9_=+.@-]{1,15}" value="wg0" dir="ltr"></div><div class="field"><label>کد کشور</label><input name="country" required minlength="2" maxlength="2" class="ltr-input" value="${esc(usableNodes[0].country)}"></div><div class="field"><label>Endpoint کاربران</label><input name="endpoint" required maxlength="255" class="ltr-input" placeholder="vpn.example.com:51820"></div><div class="field"><label>کلید عمومی WireGuard</label><input name="public_key" required minlength="10" maxlength="64" class="ltr-input"></div><div class="field"><label>Pool IPv4</label><input name="address_pool" required class="ltr-input" placeholder="10.44.0.0/24"></div><div class="field"><label>DNS کاربران</label><input name="dns" value="1.1.1.1" class="ltr-input"></div></div><div class="notice info">نود پس از نصب و ثبت‌نام، Interface را خودکار معرفی می‌کند. مقادیر این فرم باید با تنظیم واقعی WireGuard روی VPS یکسان باشند.</div>`, {
        submit: 'ثبت Interface', onSubmit: async values => {
          const payload = Object.fromEntries(['name', 'country', 'endpoint', 'public_key', 'address_pool', 'dns', 'node_id', 'interface_name'].map(key => [key, values.get(key).trim()]));
          payload.country = payload.country.toUpperCase(); payload.agent_url = ''; payload.agent_secret = '';
          await api('/servers', { method: 'POST', body: JSON.stringify(payload) });
          return { message: 'Interface ثبت شد' };
        },
      });
    }
    function issueKeyForm() {
      const storeDefaults = new Set(['plans:read', 'users:write', 'orders:create', 'orders:read', 'payments:confirm', 'subscriptions:read', 'peers:read']);
      const fields = `<div class="field"><label>نام کلید / سرویس متصل</label><input name="name" required maxlength="120" placeholder="shop-backend"></div><div class="field"><label>دسترسی‌ها</label><div class="checkbox-list">${SCOPES.map(([scope, label]) => `<label class="check-row"><input type="checkbox" name="scopes" value="${scope}" ${storeDefaults.has(scope) ? 'checked' : ''}><span><span class="mono">${scope}</span><br><span class="field-help">${label}</span></span></label>`).join('')}</div></div><div class="notice">برای Backend فروش، فقط scopeهای موردنیاز را انتخاب کنید. کلیدهای این Tenant به همان داده‌های Tenant دسترسی خواهند داشت.</div>`;
      openModal('صدور کلید API', fields, {
        submit: 'صدور کلید', onSubmit: async values => {
          const scopes = values.getAll('scopes');
          if (!scopes.length) throw new Error('حداقل یک scope انتخاب کنید.');
          const created = await api('/api-keys', { method: 'POST', body: JSON.stringify({ name: values.get('name').trim(), scopes }) });
          closeModal(); showSecret(created.secret, created.name); await refreshAll(); return { keepOpen: true };
        },
      });
    }
    function showSecret(secret, name) {
      openModal('کلید صادر شد', `<div class="notice">این مقدار فقط همین‌بار نمایش داده می‌شود. پیش از بستن پنجره آن را در secret manager امن ذخیره کنید.</div><div class="secret-output"><strong>${esc(name)}</strong><code>${esc(secret)}</code></div><div class="field-help" style="margin-top:10px">کلید را در JavaScript مرورگر، اپ موبایل یا مخزن Git قرار ندهید.</div>`, { hideSubmit: true });
      const foot = document.createElement('div'); foot.className = 'dialog-foot'; foot.innerHTML = '<button class="primary-button" data-copy-secret>کپی کلید</button><button class="outline-button" data-close>بستن</button>';
      $('.dialog', $('#modal-root')).append(foot);
      foot.querySelector('[data-copy-secret]').onclick = () => copyText(secret, 'کلید کپی شد'); foot.querySelector('[data-close]').onclick = closeModal;
    }
    function webhookForm() {
      openModal('افزودن Webhook', `<div class="field"><label>آدرس HTTPS مقصد</label><input name="url" type="url" required placeholder="https://shop.example.com/hooks/wireguard" dir="ltr"></div><div class="field"><label>رویدادها</label><div class="checkbox-list">${EVENTS.map(event => `<label class="check-row"><input type="checkbox" name="events" value="${event}" ${['payment.confirmed', 'subscription.active', 'subscription.failed'].includes(event) ? 'checked' : ''}><span class="mono">${event}</span></label>`).join('')}</div></div>`, {
        submit: 'ثبت Webhook', onSubmit: async values => {
          const events = values.getAll('events'); if (!events.length) throw new Error('حداقل یک رویداد انتخاب کنید.');
          const hook = await api('/webhooks', { method: 'POST', body: JSON.stringify({ url: values.get('url').trim(), events }) });
          closeModal(); openModal('Webhook ساخته شد', `<div class="notice">Secret امضا فقط یک‌بار نمایش داده می‌شود. آن را در Backend مقصد ذخیره کنید.</div><div class="field"><label>آدرس</label><input dir="ltr" readonly value="${esc(hook.url)}"></div><div class="secret-output"><strong>Signing secret</strong><code>${esc(hook.secret)}</code></div>`, { hideSubmit: true });
          const foot = document.createElement('div'); foot.className = 'dialog-foot'; foot.innerHTML = '<button class="primary-button" data-copy-hook>کپی Secret</button><button class="outline-button" data-close>بستن</button>';
          $('.dialog', $('#modal-root')).append(foot); foot.querySelector('[data-copy-hook]').onclick = () => copyText(hook.secret, 'Secret کپی شد'); foot.querySelector('[data-close]').onclick = closeModal;
          await refreshAll(); return { keepOpen: true };
        },
      });
    }

    async function inspectUser(userId) {
      const user = await api(`/users/${escapePath(userId)}`); state.userLookup = user; await go('users');
    }
    async function handleAction(button) {
      const action = button.dataset.action, id = button.dataset.id;
      if (action === 'new-plan') return planForm();
      if (action === 'edit-plan') return planForm(state.plans.find(plan => plan.id === id));
      if (action === 'disable-plan') {
        if (!confirm('این طرح از فهرست فروش خارج شود؟ اشتراک‌های موجود تغییر نمی‌کنند.')) return;
        await api(`/plans/${escapePath(id)}`, { method: 'DELETE' }); toast('طرح غیرفعال شد'); return refreshAll();
      }
      if (action === 'enable-plan') {
        await api(`/plans/${escapePath(id)}`, { method: 'PATCH', body: JSON.stringify({ active: true }) });
        toast('طرح فعال شد'); return refreshAll();
      }
      if (action === 'new-user') return openModal('ساخت کاربر', '<div class="field"><label>شناسه خارجی پایدار</label><input name="external_id" required maxlength="200" dir="ltr" placeholder="customer-1042"></div><div class="field-help">در صورت وجود این شناسه در Tenant، همان کاربر بازگردانده می‌شود.</div>', { submit: 'ساخت کاربر', onSubmit: async values => { const user = await api('/users', { method: 'POST', body: JSON.stringify({ external_id: values.get('external_id').trim() }) }); state.userLookup = user; return { message: `کاربر ساخته شد: ${user.id}` }; } });
      if (action === 'new-order') return orderForm(button.dataset.user || '');
      if (action === 'confirm-payment') return confirmPayment(state.orders.find(order => order.id === id));
      if (action === 'orders-prev') return loadOrders(state.ordersOffset - PAGE_SIZE);
      if (action === 'orders-next') return loadOrders(state.ordersOffset + PAGE_SIZE);
      if (action === 'subs-prev') return loadSubscriptions(state.subscriptionsOffset - PAGE_SIZE);
      if (action === 'subs-next') return loadSubscriptions(state.subscriptionsOffset + PAGE_SIZE);
      if (action === 'users-prev') return loadUsers(state.usersOffset - PAGE_SIZE);
      if (action === 'users-next') return loadUsers(state.usersOffset + PAGE_SIZE);
      if (action === 'keys-prev') return loadKeys(state.keysOffset - PAGE_SIZE);
      if (action === 'keys-next') return loadKeys(state.keysOffset + PAGE_SIZE);
      if (action === 'open-order') {
        const order = await api(`/orders/${escapePath(id)}`);
        return openModal('جزئیات سفارش', `<div class="grid-2"><div class="field"><label>شناسه سفارش</label><input readonly dir="ltr" value="${esc(order.id)}"></div><div class="field"><label>نوع / وضعیت</label><p>${status(order.kind)} ${status(order.status)}</p></div><div class="field"><label>شناسه کاربر</label><input readonly dir="ltr" value="${esc(order.user_id)}"></div><div class="field"><label>شناسه طرح</label><input readonly dir="ltr" value="${esc(order.plan_id)}"></div><div class="field"><label>مبلغ</label><p>${money(order.price_minor, order.currency)}</p></div><div class="field"><label>تاریخ ثبت</label><p>${date(order.created_at, true)}</p></div></div>`, { hideSubmit: true });
      }
      if (action === 'subscription-detail') {
        const sub = await api(`/subscriptions/${escapePath(id)}`);
        return openModal('جزئیات اشتراک', `<div class="grid-2"><div class="field"><label>شناسه اشتراک</label><input dir="ltr" readonly value="${esc(sub.id)}"></div><div class="field"><label>وضعیت</label><p>${status(sub.status)}</p></div><div class="field"><label>کاربر</label><input dir="ltr" readonly value="${esc(sub.user_id)}"></div><div class="field"><label>طرح</label><input dir="ltr" readonly value="${esc(sub.plan_id)}"></div><div class="field"><label>مصرف</label><p>${bytes(sub.used_bytes)} از ${bytes(sub.traffic_limit_bytes)}</p></div><div class="field"><label>انقضا</label><p>${date(sub.expires_at, true)}</p></div></div>`, { hideSubmit: true });
      }
      if (action === 'subscription-peers') { state.peerFilters = { q: id, status: '', country: '' }; state.peerOffset = 0; return go('peers'); }
      if (action === 'add-peer-for-sub') return addPeerForm(id);
      if (action === 'suspend-sub') {
        if (!confirm('اشتراک تعلیق شود؟ دستگاه‌های فعال لغو خواهند شد.')) return;
        await api(`/subscriptions/${escapePath(id)}/suspend`, { method: 'POST' }); toast('اشتراک برای تعلیق ثبت شد'); return refreshAll();
      }
      if (action === 'resume-sub') {
        await api(`/subscriptions/${escapePath(id)}/resume`, { method: 'POST' }); toast('درخواست فعال‌سازی ثبت شد'); return refreshAll();
      }
      if (action === 'renew-sub') {
        const order = await api(`/subscriptions/${escapePath(id)}/renew`, { method: 'POST', headers: { 'Idempotency-Key': crypto.randomUUID ? crypto.randomUUID() : `renew-${Date.now()}` } });
        toast(`سفارش تمدید ${order.id} ساخته شد`); return refreshAll();
      }
      if (action === 'new-node') return nodeSetup();
      if (action === 'test-node') {
        const result = await api(`/nodes/${escapePath(id)}/test-connection`, { method: 'POST' });
        toast(result.healthy ? 'ارتباط Node موفق بود' : 'Node پاسخ‌گو نیست', !result.healthy); return refreshAll();
      }
      if (action === 'toggle-node' || action === 'toggle-server') {
        const active = button.dataset.active !== 'true';
        const noun = action === 'toggle-node' ? 'Node' : 'Interface';
        if (!active && !confirm(`${noun} غیرفعال شود؟ این کار تخصیص جدید را متوقف می‌کند.`)) return;
        const endpoint = action === 'toggle-node' ? `/nodes/${escapePath(id)}` : `/servers/${escapePath(id)}`;
        await api(endpoint, { method: 'PATCH', body: JSON.stringify({ active }) }); toast(`${noun} ${active ? 'فعال' : 'غیرفعال'} شد`); return refreshAll();
      }
      if (action === 'new-server') return serverForm();
      if (action === 'peer-config') {
        const blob = await binary(`/peers/${escapePath(id)}/config`), url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = `${id}.conf`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1200); return;
      }
      if (action === 'peer-qr') {
        const blob = await binary(`/peers/${escapePath(id)}/qr`), url = URL.createObjectURL(blob);
        openModal('QR اتصال WireGuard', `<div class="notice">QR حاوی کلید خصوصی اتصال است.</div><img class="qr-image" src="${url}" alt="QR اتصال WireGuard">`, { hideSubmit: true, onClose: () => URL.revokeObjectURL(url) }); return;
      }
      if (action === 'add-peer') {
        return addPeerForm(button.dataset.sub, button.dataset.country || '');
      }
      if (action === 'revoke-peer') {
        if (!confirm('این اتصال لغو شود؟ پس از اجرای فرمان روی Node دیگر قابل استفاده نخواهد بود.')) return;
        await api(`/peers/${escapePath(id)}/revoke`, { method: 'POST' }); toast('درخواست لغو ثبت شد'); return loadPeers();
      }
      if (action === 'recreate-peer') {
        if (!confirm('کلید و فایل اتصال بازسازی شود؟ فایل قبلی دیگر کار نخواهد کرد.')) return;
        await api(`/peers/${escapePath(id)}/recreate`, { method: 'POST' }); toast('درخواست بازسازی ثبت شد'); return loadPeers();
      }
      if (action === 'peer-prev') { state.peerOffset = Math.max(0, state.peerOffset - PAGE_SIZE); return loadPeers(); }
      if (action === 'peer-next') { state.peerOffset += PAGE_SIZE; return loadPeers(); }
      if (action === 'new-webhook') return webhookForm();
      if (action === 'delete-webhook') {
        if (!confirm('Webhook غیرفعال شود؟')) return;
        await api(`/webhooks/${escapePath(id)}`, { method: 'DELETE' }); toast('Webhook غیرفعال شد'); return refreshAll();
      }
      if (action === 'enable-webhook') {
        await api(`/webhooks/${escapePath(id)}`, { method: 'PATCH', body: JSON.stringify({ active: true }) });
        toast('Webhook فعال شد'); return refreshAll();
      }
      if (action === 'webhook-deliveries') {
        const rows = await api(`/webhooks/${escapePath(id)}/deliveries?offset=0&limit=50`);
        return openModal('تحویل‌های Webhook', table(['رویداد', 'وضعیت', 'تلاش', 'شناسه'], rows.map(row => `<tr><td>${esc(row.event)}</td><td>${status(row.status)}</td><td>${num(row.attempts)}</td><td class="mono">${esc(row.id)}</td></tr>`)), { wide: true, hideSubmit: true });
      }
      if (action === 'new-key') return issueKeyForm();
      if (action === 'revoke-key') {
        if (!confirm('این کلید API لغو شود؟ درخواست‌های جدید با آن رد خواهند شد.')) return;
        await api(`/api-keys/${escapePath(id)}`, { method: 'DELETE' });
        toast('کلید API لغو شد'); return refreshAll();
      }
      if (action === 'reload-audit') return loadAudit();
      if (action === 'go-orders') return go('orders');
      if (action === 'lookup-user') return inspectUser(id);
      if (action === 'toggle-user') {
        const next = button.dataset.status === 'active' ? 'disabled' : 'active';
        if (next === 'disabled' && !confirm('دسترسی کاربر جدیداً غیرفعال شود؟')) return;
        state.userLookup = await api(`/users/${escapePath(id)}`, { method: 'PATCH', body: JSON.stringify({ status: next }) });
        toast('وضعیت کاربر تغییر کرد'); return refreshAll();
      }
    }

    $('#view').addEventListener('click', async event => {
      const goButton = event.target.closest('[data-go]');
      if (goButton) return go(goButton.dataset.go);
      const button = event.target.closest('[data-action]');
      if (!button || button.disabled) return;
      button.disabled = true;
      try { await handleAction(button); }
      catch (error) { toast(`${error.message}${error.requestId ? ` · ${error.requestId}` : ''}`, true); }
      finally { if (button.isConnected) button.disabled = false; }
    });
    $('#view').addEventListener('submit', async event => {
      const form = event.target;
      if (!form.matches('#user-filter, #peer-filter, #order-filter, #subscription-filter')) return;
      event.preventDefault();
      try {
        const values = new FormData(form);
        if (form.id === 'user-filter') { state.userFilters = { q: String(values.get('q') || '').trim(), status: String(values.get('status') || '') }; return await loadUsers(0); }
        if (form.id === 'peer-filter') { state.peerFilters = { q: String(values.get('q') || '').trim(), status: String(values.get('status') || ''), country: String(values.get('country') || '') }; state.peerOffset = 0; return await loadPeers(); }
        if (form.id === 'order-filter') { state.orderFilters = { q: String(values.get('q') || '').trim(), status: String(values.get('status') || '') }; return await loadOrders(0); }
        if (form.id === 'subscription-filter') { state.subscriptionFilters = { q: String(values.get('q') || '').trim(), status: String(values.get('status') || '') }; return await loadSubscriptions(0); }
      } catch (error) { toast(error.message, true); }
    });
    $$('.nav-item').forEach(button => button.addEventListener('click', () => go(button.dataset.view)));
    $('#refresh-button').addEventListener('click', refreshAll);
    $('#api-key-button').addEventListener('click', () => {
      openModal('تنظیم کلید API', `<div class="notice">کلید فقط در session همین مرورگر نگه‌داری می‌شود. پس از تغییر کلید، داده‌ها دوباره بارگذاری می‌شوند.</div><div class="field"><label>X-API-Key</label><input name="key" type="password" dir="ltr" autocomplete="off" required value="${esc(apiKey())}"></div>`, {
        submit: 'اتصال و بارگذاری', onSubmit: async values => {
          sessionStorage.setItem('wg_api_key', values.get('key').trim());
          closeModal(); await refreshAll(); return { keepOpen: true };
        },
      });
    });
    $('#mobile-menu').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
    $('#nav-scrim').addEventListener('click', () => $('#sidebar').classList.remove('open'));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });

    async function boot() {
      if (!apiKey()) return renderLogin();
      await refreshAll();
    }
    boot();
  </script>
</body>
</html>
